name: Gravity Icons Release Pipeline

on:
  workflow_dispatch:
    inputs:
      SourceRef:
        description: 'Exact verified source commit (40-character SHA)'
        type: string
        required: true
      PublishToNuget:
        description: 'Publish the validated artifact to nuget.org'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gravity-icons-release
  cancel-in-progress: false

jobs:
  build_and_validate:
    runs-on: windows-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.source.outputs.version }}
      atomui_version: ${{ steps.source.outputs.atomui_version }}
    steps:
      - name: Validate repository and branch for publication
        if: ${{ inputs.PublishToNuget }}
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.SourceRef }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ine 'AtomUI/AtomUI.Icons.Gravity' -or $env:GITHUB_REF -cne 'refs/heads/release/6.0') {
            throw 'NuGet publication must be dispatched on AtomUI/AtomUI.Icons.Gravity from release/6.0.'
          }
          if ($env:SOURCE_REF -ine $env:GITHUB_SHA) {
            throw 'SourceRef must match the workflow commit SHA for NuGet publication.'
          }
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.PublishToNuget && github.sha || inputs.SourceRef }}
          persist-credentials: false
      - name: Verify immutable source and versions
        id: source
        shell: pwsh
        env:
          SOURCE_REF: ${{ inputs.SourceRef }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_REF -notmatch '^[0-9a-fA-F]{40}$') { throw 'SourceRef must be a full commit SHA' }
          if ((git rev-parse HEAD) -ne $env:SOURCE_REF) { throw 'Checkout does not match SourceRef' }
          [xml]$versions = Get-Content build/Version.props
          $version = [string]$versions.Project.PropertyGroup.GravityVersion
          $atomui = [string]$versions.Project.PropertyGroup.AtomUIVersion
          if ($version -ne $atomui) { throw 'Gravity and AtomUI versions must match' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "atomui_version=$atomui" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test release tooling
        run: python -m unittest discover -s scripts/release/tests -p "test_*.py" -v
      - name: Restore, build and test Release
        shell: pwsh
        run: |
          dotnet restore Gravity.slnx -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Gravity.slnx -c Release --no-restore -m:1 -nr:false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Gravity.slnx -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack once, validate and hash
        shell: pwsh
        env:
          VERSION: ${{ steps.source.outputs.version }}
          ATOMUI_VERSION: ${{ steps.source.outputs.atomui_version }}
          SOURCE_REF: ${{ inputs.SourceRef }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'gravity-nuget'
          New-Item -ItemType Directory -Path $packageDir | Out-Null
          dotnet pack src/AtomUI.Icons.Gravity/AtomUI.Icons.Gravity.csproj -c Release --no-build --no-restore -o $packageDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/validate_nupkg.py $packageDir --expected-version $env:VERSION --expected-atomui-version $env:ATOMUI_VERSION --expected-commit $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = Get-ChildItem $packageDir -Filter '*.nupkg'
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content (Join-Path $packageDir 'SHA256SUMS') -Encoding ascii
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: NuGetPackages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gravity-nuget/*
          if-no-files-found: error

  publish:
    if: ${{ inputs.PublishToNuget }}
    needs: build_and_validate
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: gravity-icons-nuget-production
      cancel-in-progress: false
    steps:
      - name: Require the verified build artifact
        if: ${{ needs.build_and_validate.outputs.artifact_id == '' }}
        shell: pwsh
        run: throw 'The build did not provide a release artifact ID.'
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.build_and_validate.outputs.artifact_id }}
          path: ${{ runner.temp }}/gravity-nuget
      - name: Get a short-lived NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: chinware
      - name: Verify downloaded artifact and publish without rebuilding
        shell: pwsh
        env:
          VERSION: ${{ needs.build_and_validate.outputs.version }}
          ATOMUI_VERSION: ${{ needs.build_and_validate.outputs.atomui_version }}
          SOURCE_REF: ${{ inputs.SourceRef }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packageDir = Join-Path $env:RUNNER_TEMP 'gravity-nuget'
          $packages = @(Get-ChildItem $packageDir -Filter '*.nupkg')
          if ($packages.Count -ne 1) { throw 'Expected exactly one validated package' }
          $package = $packages[0]
          $checksum = (Get-Content (Join-Path $packageDir 'SHA256SUMS')).Trim()
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -ne "$hash  $($package.Name)") { throw 'Artifact checksum mismatch' }
          python scripts/release/validate_nupkg.py $packageDir --expected-version $env:VERSION --expected-atomui-version $env:ATOMUI_VERSION --expected-commit $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'NuGet trusted publishing did not provide a temporary API key' }
          dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet push failed or was ambiguous; inspect this run before any user-authorized retry' }
          Write-Output "NuGet upload succeeded for AtomUI.Icons.Gravity $env:VERSION (artifact SHA256 $hash); GitHub Actions publication is complete."
